<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virexo Admin — Users</title><link rel="stylesheet" href="css/style.css"><style>body{font-family:Arial;padding:30px;background:#f5f7fb}.card{background:#fff;padding:22px;border-radius:16px;margin:15px 0;box-shadow:0 8px 30px #0001}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #eee;padding:13px 0}.badge{padding:5px 9px;border-radius:99px;background:#eaf2ff;color:#1456c0;font-size:12px}.btn{padding:8px 12px;border:0;border-radius:8px;background:#0b5cff;color:#fff;cursor:pointer}</style></head><body><h1>Virexo User Management</h1><div class="card"><p>This local admin view lists registered accounts. Provider verification can be toggled.</p><div id="users">Loading…</div></div><script>
async function load(){const r=await fetch('/api/auth/users');const d=await r.json();const box=document.getElementById('users');box.innerHTML=d.users.map(u=>`<div class="row"><div><b>${u.name}</b><br><small>${u.email} · ${u.role}</small></div><div>${u.role==='provider'?`<button class="btn" onclick="verify('${u.id}',${!u.verified})">${u.verified?'Unverify':'Verify provider'}</button>`:`<span class="badge">Client</span>`}</div></div>`).join('')||'No accounts yet.'}
async function verify(id,v){await fetch('/api/auth/providers/'+id+'/verify',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({verified:v})});load()}load();
</script></body></html>
